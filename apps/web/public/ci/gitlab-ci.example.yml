# Add to .gitlab-ci.yml. Set ENTITLED_URL and ENTITLED_API_KEY (masked) under
# Settings > CI/CD > Variables, and adjust the product slug and file paths.
publish-to-entitled:
  stage: deploy
  image: alpine:3.22
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    ENTITLED_PRODUCT: your-product-slug
    ENTITLED_CHANGELOG: CHANGELOG.md
    ENTITLED_PUBLISH: 'false'
  before_script:
    - apk add --no-cache curl jq coreutils
  script:
    - curl -fsSL "$ENTITLED_URL/ci/entitled-release.sh" -o entitled-release.sh
    - sh entitled-release.sh build/firmware.bin build/firmware.hex
