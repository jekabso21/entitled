packages:
  - apps/*
  - packages/*

catalogMode: strict
minimumReleaseAge: 1440
trustPolicy: no-downgrade
# Published in 2023, before npm provenance existed; pulled in by @babel/core via the auth CLI.
trustPolicyExclude:
  - semver@6.3.1

allowBuilds:
  esbuild: true
  '@parcel/watcher': true
  vue-demi: true
  sharp: false
  unrs-resolver: true

