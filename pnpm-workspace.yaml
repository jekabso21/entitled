packages:
  - apps/*
  - packages/*

catalogMode: strict
minimumReleaseAge: 1440
trustPolicy: no-downgrade
# Published in 2023, before npm provenance existed; pulled in by @babel/core via the auth CLI.
trustPolicyExclude:
  - semver@6.3.1

allowBuilds:
  esbuild: true
  '@parcel/watcher': true
  vue-demi: true
  sharp: false
  unrs-resolver: true

catalog:
  '@aws-sdk/client-s3': ^3.1150.0
  '@aws-sdk/s3-request-presigner': ^3.1150.0
  '@better-auth/api-key': 1.7.12
  '@better-auth/drizzle-adapter': 1.7.12
  '@eslint/js': ^10.0.1
  '@hono/node-server': ^2.1.5
  '@hono/zod-openapi': ^1.6.3
  '@nuxt/eslint': ^1.17.0
  '@nuxt/test-utils': ^4.3.4
  '@nuxt/ui': ^4.12.0
  '@opentelemetry/api': ^1.9.0
  '@playwright/test': ^1.64.1
  '@types/node': ^24.19.2
  '@types/nodemailer': ^8.0.2
  '@types/pg': ^8.23.1
  '@vitest/coverage-v8': ^5.0.5
  auth: 1.7.12
  better-auth: 1.7.12
  drizzle-kit: 1.0.0-rc.4
  drizzle-orm: 1.0.0-rc.4
  eslint: ^10.13.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-import-x: ^4.17.1
  eslint-plugin-unicorn: ^78.0.0
  globals: ^17.13.0
  hono: ^4.13.13
  nodemailer: ^10.0.0
  nuxt: ^4.6.2
  pg: ^8.23.1
  pg-boss: ^12.38.0
  prettier: ^3.9.10
  tailwindcss: ^4.3.3
  turbo: ^2.11.10
  typescript: ~6.0.3
